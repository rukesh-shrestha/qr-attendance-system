{% extends "base.html" %}

{% block title %}Login – QR Attendance{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">

    <div class="card shadow-lg border-0 rounded-3 mt-3">
      <div class="card-body p-4">

        <div class="text-center mb-4">
          <i class="bi bi-qr-code-scan display-4 text-primary"></i>
          <h2 class="fw-bold mt-2">QR Attendance</h2>
          <p class="text-muted">Sign in to your account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" novalidate>

          <!-- Role selector -->
          <div class="mb-3">
            <label class="form-label fw-semibold">I am a</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="role"
                  id="roleStudent"
                  value="student"
                  checked
                />
                <label class="form-check-label" for="roleStudent">
                  <i class="bi bi-mortarboard me-1"></i>Student
                </label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="role"
                  id="roleTeacher"
                  value="teacher"
                />
                <label class="form-check-label" for="roleTeacher">
                  <i class="bi bi-person-workspace me-1"></i>Teacher
                </label>
              </div>
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="you@college.edu"
                required
                autofocus
              />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>

      </div><!-- /.card-body -->
    </div><!-- /.card -->

    <p class="text-center text-muted mt-3 small">
      <i class="bi bi-shield-lock me-1"></i>
      Secure login. Attendance is only accepted from the college WiFi network.
    </p>

  </div>
</div>
{% endblock %}
